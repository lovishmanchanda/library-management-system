<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Bookings</title>
</head>
<body>
    <h1>My Bookings</h1>
    <a href="index.html">Home</a>
    <br><br>
    <a href="profile.html">Profile</a>
    <div id="bookingsContainer"></div>

    <script>
        let bookingsContainer = document.getElementById("bookingsContainer");
        let currentUser = JSON.parse(localStorage.getItem("currentUser"));
        
        let resources = [];
        let myBookings = [];

        if (!currentUser) {
            alert("Please login first");
            window.location.href = "login.html";
        } else {
            loadBookings();
        }

        async function loadBookings() {
            try {
                let resResp = await fetch("http://localhost:3000/resources");
                resources = await resResp.json();

                let reqResp = await fetch("http://localhost:3000/reservations");
                let allReservations = await reqResp.json();

                myBookings = allReservations.filter(reservation =>
                    String(reservation.userId) === String(currentUser.id)
                );

                renderBookings();
            } catch (error) {
                console.error("Error loading data:", error);
            }
        }

        function renderBookings() {
            bookingsContainer.innerHTML = "";

            if (myBookings.length === 0) {
                bookingsContainer.innerHTML = `
                    <p>You have no bookings yet.</p>
                `;
                return;
            }

            myBookings.forEach(booking => {
                let resource = resources.find(r => String(r.id) === String(booking.resourceId));
                let resourceName = resource ? resource.label : "Unknown Resource";
                
                let timeStatus = getTimeStatus(booking);
                let displayStatus = booking.status;
                if (
                    booking.status === "cancelled" ||
                    booking.status === "completed" ||
                    booking.status === "no_show"
                ) {
                    timeStatus = "";
                }

                let canCancel = false;
                if (booking.status === "pending" || booking.status === "confirmed") {
                    if (timeStatus === "Upcoming") {
                        canCancel = true;
                    }
                }

                bookingsContainer.innerHTML += `
                    <div>
                        <h3>Resource: ${resourceName}</h3>
                        <p>Date: ${booking.date}</p>
                        <p>Time: ${booking.startTime} - ${booking.endTime}</p>
                        <p>Status: ${displayStatus}${timeStatus ? ` (${timeStatus})` : ""}</p>
                        ${
                            canCancel
                            ? `
                                <button onclick="cancelBooking('${booking.id}')">
                                    Cancel Booking
                                </button>
                            `
                            : ""
                        }
                    </div>
                    <hr>
                `;
            });
        }

        function getTimeStatus(booking) {
            let now = new Date();
            let bookingStart = new Date(booking.date + "T" + booking.startTime);
            let bookingEnd = new Date(booking.date + "T" + booking.endTime);

            if (now < bookingStart) {
                return "Upcoming";
            }

            if (now >= bookingStart && now <= bookingEnd) {
                return "Active";
            }

            return "Completed";
        }

        async function cancelBooking(id) {
            let booking = myBookings.find(b => String(b.id) === String(id));

            if (!booking) {
                alert("You cannot cancel this booking");
                return;
            }

            let timeStatus = getTimeStatus(booking);

            if (timeStatus === "Active") {
                alert("You cannot cancel an active booking");
                return;
            }

            if (timeStatus === "Completed") {
                alert("You cannot cancel a completed booking");
                return;
            }

            if (booking.status === "cancelled" || booking.status === "completed" || booking.status === "no_show") {
                alert("You cannot cancel this booking");
                return;
            }

            try {
                let response = await fetch("http://localhost:3000/reservations/" + id, {
                    method: "PATCH",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ status: "cancelled" })
                });

                if (response.ok) {
                    alert("Booking cancelled successfully");
                    loadBookings();
                } else {
                    alert("Failed to cancel booking");
                }
            } catch (error) {
                console.error("Error cancelling booking:", error);
                alert("Unable to connect to server");
            }
        }
    </script>
</body>
</html>
