<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Bookings</title>
</head>
<body>
    <h1>My Bookings</h1>
    <a href="index.html">Home</a>
    <br><br>
    <a href="profile.html">Profile</a>
    <div id="bookingsContainer"></div>

    <script>
        let bookingsContainer = document.getElementById("bookingsContainer");
        let bookings = JSON.parse(localStorage.getItem("bookings")) || [];
        let currentUser = JSON.parse(localStorage.getItem("currentUser"));

        if (!currentUser) {
            alert("Please login first");
            window.location.href = "login.html";
        } else {
            let myBookings = bookings.filter(booking =>
                booking.userEmail === currentUser.email
            );

            if (myBookings.length === 0) {
                bookingsContainer.innerHTML = `
                    <p>You have no bookings yet.</p>
                `;
            } else {
                myBookings.forEach(booking => {
                    let index = bookings.indexOf(booking);
                    let status = getBookingStatus(booking);

                    bookingsContainer.innerHTML += `
                        <div>
                            <h3>Resource: ${booking.resourcesName}</h3>
                            <p>Date: ${booking.date}</p>
                            <p>Time: ${booking.startTime} - ${booking.endTime}</p>
                            <p>Status: ${status}</p>
                            ${
                                status === "Upcoming"
                                ? `
                                    <button onclick="cancelBooking(${index})">
                                        Cancel Booking
                                    </button>
                                `
                                : ""
                            }
                        </div>
                        <hr>
                    `;
                });
            }
        }

        function getBookingStatus(booking) {
            if (booking.status === "No-Show") {
                return "No-Show";
            }

            if (booking.status === "Completed") {
                return "Completed";
            }

            let now = new Date();
            let bookingStart = new Date(
                booking.date + "T" + booking.startTime
            );
            let bookingEnd = new Date(
                booking.date + "T" + booking.endTime
            );

            if (now < bookingStart) {
                return "Upcoming";
            }

            if (now >= bookingStart && now <= bookingEnd) {
                return "Active";
            }

            return "Completed";
        }

        function cancelBooking(index) {
            let booking = bookings[index];

            if (!booking || booking.userEmail !== currentUser.email) {
                alert("You cannot cancel this booking");
                return;
            }

            let status = getBookingStatus(booking);

            if (status === "Active") {
                alert("You cannot cancel an active booking");
                return;
            }

            if (status === "Completed") {
                alert("You cannot cancel a completed booking");
                return;
            }

            if (status === "No-Show") {
                alert("You cannot cancel a No-Show booking");
                return;
            }

            bookings.splice(index, 1);

            localStorage.setItem(
                "bookings",
                JSON.stringify(bookings)
            );

            alert("Booking cancelled successfully");

            location.reload();
        }
    </script>
</body>
</html>
